<div class="app-shell">
  <aside class="sidebar" [class.sidebar-open]="menuOpen">
    <a class="brand" routerLink="/prehľad" (click)="menuOpen = false" aria-label="Smart pokladnička, úvodná stránka">
      <span class="brand-icon">s<span>€</span></span>
      <span class="brand-name">smart<span>pokladnička</span></span>
    </a>

    <div class="nav-label">MENU</div>
    <nav class="main-nav" aria-label="Hlavná navigácia">
      <a routerLink="/prehľad" routerLinkActive="active" (click)="menuOpen = false"><span class="nav-glyph">◫</span> Prehľad</a>
      <a routerLink="/vydavky" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" (click)="menuOpen = false"><span class="nav-glyph">↗</span> Výdavky</a>
      <a routerLink="/nastavenia" routerLinkActive="active" (click)="menuOpen = false"><span class="nav-glyph">⚙</span> Nastavenia</a>
    </nav>

    <div class="sidebar-note">
      <p>Malý tip</p>
      <span>Zapíš si nákup hneď, kým naň nezabudneš.</span>
    </div>

    <div class="sidebar-user">
      <span class="avatar">A</span>
      <span><strong>Adam</strong><small>Osobný účet</small></span>
    </div>
  </aside>

  <div class="mobile-scrim" [class.visible]="menuOpen" (click)="menuOpen = false"></div>

  <main class="main-area">
    <header class="topbar">
      <button class="menu-toggle" type="button" (click)="menuOpen = !menuOpen" aria-label="Otvoriť navigáciu">☰</button>
      <div class="breadcrumbs"><span>Moje financie</span><span class="slash">/</span><strong>Prehľad</strong></div>
      <div class="topbar-right"><span class="today">{{ today }}</span></div>
    </header>

    <div class="page-content"><router-outlet /></div>
    <footer class="footer">Smart pokladnička <span>·</span> Jednoduchý prehľad každodenných výdavkov.</footer>
  </main>
</div>
